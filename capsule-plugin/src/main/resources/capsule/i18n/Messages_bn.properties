# ── Task Descriptions ──
task.generateCapsuleScript.description=extractSpeakerNotes দ্বারা উৎপাদিত *-script.txt পড়ে এবং capsule স্ক্রিপ্ট যাচাই করে
task.generateCapsule.description=capsule স্ক্রিপ্ট থেকে TTS অডিও ফাইল তৈরি করে (Piper প্লেসহোল্ডার)
task.generateCapsuleVideo.description=TTS অডিও deck HTML-এ ইনজেক্ট করে তারপর Playwright Java এর মাধ্যমে ভিডিও ক্যাপচার করে
task.generateCapsuleVideoAllLanguages.description=অনুবাদিত deck এবং স্ক্রিপ্ট থেকে প্রতিটি লক্ষ্য ভাষার জন্য একটি স্থানীয় capsule WebM তৈরি করে
task.deployCapsule.description=FFmpeg এর মাধ্যমে capsule ভিডিওগুলিকে উল্লম্ব 9:16 বিন্যাসে (TikTok/Shorts) ক্রপ করে
task.distributeCapsuleVideo.description=capsule WebM ভিডিওগুলিকে একটি সংস্করণযুক্ত গন্তব্য ডিরেক্টরিতে কপি করে (CAP-ARCH-7)
task.collectCapsuleContext.description=capsule প্রসঙ্গ (ভিডিও পথ + মেটাডেটা) কে N3-ইঞ্জিন-সামঞ্জস্যপূর্ণ JSON হিসাবে রপ্তানি করে
task.transformCapsuleContext.description=capsule-context.json ফাইলটি পার্স করে এবং deck এর একটি তালিকা প্রদান করে
task.collectCapsuleRetrieve.description=capsule-context.json থেকে capsule deck পুনরুদ্ধার করে (N3 ইঞ্জিন চুক্তি)
task.scaffoldCapsuleContext.description=মন্তব্য সহ একটি ডিফল্ট capsule-context.yml কনফিগারেশন ফাইল স্ক্যাফোল্ড করে
task.capsuleAiSmokeTest.description=ন্যূনতম প্রম্পট সহ codebase LLM ব্রিজের (LlmBuildService + ChatModel অ্যাডাপ্টার) স্মোক-টেস্ট করে
task.collectCapsuleAugmentedContext.description=সংবর্ধিত প্রসঙ্গ (EAGER গভর্নেন্স + RAG + Graphify + Docs) সংগ্রহ করে এবং সামগ্রী তৈরির জন্য এটি রেন্ডার করে
task.generateCapsuleContent.description=koog পাইপলাইন (propose-context → validate → speaker notes তৈরি) LLM এর মাধ্যমে অর্কেস্ট্রেট করে এবং TTS স্ক্রিপ্ট অনুসৃত করে
task.extractSpeakerNotes.description=AsciiDoc deck থেকে speaker notes বের করে এবং capsule স্ক্রিপ্ট তৈরি করে (slider-gradle এর generateCapsule প্রতিস্থাপন করে)।
task.translateAndExtractSpeakerNotes.description=একটি deck একাধিক ভাষায় অনুবাদ করে তারপর সমস্ত অনুবাদিত deck-এর জন্য speaker notes বের করে। translateDeck এবং extractSpeakerNotes এর উপর নির্ভরশীল।
task.translateAndGenerateCapsuleVideos.description=deck অনুবাদ করে, সমস্ত অনুবাদিত deck-এর জন্য speaker notes বের করে, তারপর প্রতিটি ভাষার জন্য একটি স্থানীয় capsule WebM তৈরি করে। translateAndExtractSpeakerNotes এবং generateCapsuleVideoAllLanguages এর উপর নির্ভরশীল।
task.generateCapsuleContentAndVideos.description=LLM সামগ্রী তৈরি অর্কেস্ট্রেট করে তারপর সম্পূর্ণ বহু-ভাষা ভিডিও পাইপলাইন চালায়। generateCapsuleContent এবং translateAndGenerateCapsuleVideos এর উপর নির্ভরশীল।
task.validateCapsuleVideoDuration.description=চূড়ান্ত ভিডিওর সময়কাল পরিমাপ করে এবং TTS অডিও সময়কালের যোগফলের সাথে তুলনা করে (CAP-CR3-1 ভিডিও দৃঢ়তা চুক্তি)
task.generateCapsuleTranscript.description=capsule speaker notes থেকে একটি AsciiDoc ট্রান্সক্রিপ্ট নিবন্ধ তৈরি করে (TEMPLATE বা LLM-সমৃদ্ধ)
task.generateCapsulePodcast.description=প্রতিটি স্লাইডের TTS MP3 ফাইলগুলিকে FFmpeg concat demuxer-এর মাধ্যমে একটি পডকাস্ট MP3-এ যুক্ত করে (শুধু অডিও মোবাইল ব্যবহার)
