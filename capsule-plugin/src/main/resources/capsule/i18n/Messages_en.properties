# Capsule Plugin — Messages (English)
# Base language, all keys defined here

# ── Task Groups ──
task.group.generate=generate
task.group.collect=collect
task.group.deploy=deploy
task.group.distribute=distribute
task.group.transform=transform
task.group.capsule=capsule
task.group.verification=verification

# ── Task Descriptions ──
task.generateCapsuleScript.description=Reads *-script.txt produced by extractSpeakerNotes and validates the capsule script
task.generateCapsule.description=Generates TTS audio files from capsule scripts (Piper placeholder)
task.generateCapsuleVideo.description=Injects TTS audio into deck HTML then captures video via Playwright Java
task.generateCapsuleVideoAllLanguages.description=Generates one localized capsule WebM per target language from translated decks + scripts
task.deployCapsule.description=Crops capsule videos to vertical 9:16 format (TikTok/Shorts) via FFmpeg
task.distributeCapsuleVideo.description=Copies capsule WebM videos to a versioned destination directory (CAP-ARCH-7)
task.collectCapsuleContext.description=Exports capsule context (video paths + metadata) as N3-engine-compatible JSON
task.transformCapsuleContext.description=Parses the capsule-context.json file and returns a list of decks
task.collectCapsuleRetrieve.description=Retrieve capsule decks from capsule-context.json (N3 engine contract)
task.scaffoldCapsuleContext.description=Scaffolds a default capsule-context.yml configuration file with comments
task.capsuleAiSmokeTest.description=Smoke-tests the codebase LLM bridge (LlmBuildService + ChatModel adapter) with a minimal prompt
task.collectCapsuleAugmentedContext.description=Collects the augmented context (EAGER governance + RAG + Graphify + Docs) and renders it for content generation
task.generateCapsuleContent.description=Orchestrates the koog pipeline (propose-context → validate → generate speaker notes) via LLM and derives the TTS script
task.extractSpeakerNotes.description=Extract speaker notes from AsciiDoc decks and generate a capsule script (replaces slider-gradle generateCapsule).
task.translateAndExtractSpeakerNotes.description=Translate a deck into multiple languages then extract speaker notes for all translated decks. Depends on translateDeck and extractSpeakerNotes.
task.translateAndGenerateCapsuleVideos.description=Translate a deck, extract speaker notes for all translated decks, then generate one localized capsule WebM per language. Depends on translateAndExtractSpeakerNotes and generateCapsuleVideoAllLanguages.
task.generateCapsuleContentAndVideos.description=Orchestrates LLM content generation then the full multi-language video pipeline. Depends on generateCapsuleContent and translateAndGenerateCapsuleVideos.
task.validateCapsuleVideoDuration.description=Probes the final video duration and compares it to the sum of TTS audio durations (CAP-CR3-1 video solidity contract)
task.generateCapsuleTranscript.description=Produces an AsciiDoc transcript article from the capsule speaker notes (TEMPLATE or LLM-enriched)
