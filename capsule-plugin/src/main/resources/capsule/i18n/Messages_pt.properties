# Capsule Plugin — Messages (Portuguese / Português)

# ── Task Groups ──
task.group.generate=geração
task.group.collect=coleta
task.group.deploy=implantação
task.group.distribute=distribuição
task.group.transform=transformação
task.group.capsule=capsule
task.group.verification=verificação

# ── Task Descriptions ──
task.generateCapsuleScript.description=Lê os *-script.txt produzidos por extractSpeakerNotes e valida o script de capsule
task.generateCapsule.description=Gera arquivos de áudio TTS a partir de scripts de capsule (marcador de posição Piper)
task.generateCapsuleVideo.description=Injeta o áudio TTS no HTML do deck e depois captura o vídeo via Playwright Java
task.generateCapsuleVideoAllLanguages.description=Gera um WebM de capsule localizado por idioma de destino a partir de decks e scripts traduzidos
task.deployCapsule.description=Recorta os vídeos de capsule para o formato vertical 9:16 (TikTok/Shorts) via FFmpeg
task.distributeCapsuleVideo.description=Copia os vídeos WebM de capsule para um diretório de destino versionado (CAP-ARCH-7)
task.collectCapsuleContext.description=Exporta o contexto de capsule (caminhos de vídeo + metadados) como JSON compatível com o motor N3
task.transformCapsuleContext.description=Analisa o arquivo capsule-context.json e devolve uma lista de decks
task.collectCapsuleRetrieve.description=Recupera decks de capsule a partir de capsule-context.json (contrato do motor N3)
task.scaffoldCapsuleContext.description=Gera um arquivo de configuração capsule-context.yml padrão com comentários
task.capsuleAiSmokeTest.description=Faz um teste de fumaça da ponte LLM da codebase (LlmBuildService + adaptador ChatModel) com um prompt mínimo
task.collectCapsuleAugmentedContext.description=Recolhe o contexto aumentado (governança EAGER + RAG + Graphify + Docs) e renderiza-o para a geração de conteúdo
task.generateCapsuleContent.description=Orquestra o pipeline koog (propose-context → validate → gerar speaker notes) via LLM e deriva o script TTS
task.extractSpeakerNotes.description=Extrai speaker notes de decks AsciiDoc e gera um script de capsule (substitui o generateCapsule do slider-gradle).
task.translateAndExtractSpeakerNotes.description=Traduz um deck em vários idiomas e depois extrai speaker notes de todos os decks traduzidos. Depende de translateDeck e extractSpeakerNotes.
task.translateAndGenerateCapsuleVideos.description=Traduz um deck, extrai speaker notes de todos os decks traduzidos e depois gera um WebM de capsule localizado por idioma. Depende de translateAndExtractSpeakerNotes e generateCapsuleVideoAllLanguages.
task.generateCapsuleContentAndVideos.description=Orquestra a geração de conteúdo via LLM e depois executa o pipeline completo de vídeo multilíngue. Depende de generateCapsuleContent e translateAndGenerateCapsuleVideos.
task.validateCapsuleVideoDuration.description=Sonda a duração do vídeo final e compara-a com a soma das durações de áudio TTS (contrato de solidez de vídeo CAP-CR3-1)
task.generateCapsuleTranscript.description=Produz um artigo AsciiDoc de transcrição a partir das speaker notes da cápsula (TEMPLATE ou enriquecido por LLM)
