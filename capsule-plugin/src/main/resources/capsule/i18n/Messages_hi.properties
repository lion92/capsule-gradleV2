# Capsule Plugin — Messages (Hindi / हिन्दी)

# ── Task Groups ──
task.group.generate=जनरेशन
task.group.collect=संग्रह
task.group.deploy=परिनियोजन
task.group.distribute=वितरण
task.group.transform=रूपांतरण
task.group.capsule=capsule
task.group.verification=सत्यापन

# ── Task Descriptions ──
task.generateCapsuleScript.description=extractSpeakerNotes द्वारा निर्मित *-script.txt को पढ़ता है और capsule स्क्रिप्ट को मान्य करता है
task.generateCapsule.description=capsule स्क्रिप्ट से TTS ऑडियो फ़ाइलें जनरेट करता है (Piper प्लेसहोल्डर)
task.generateCapsuleVideo.description=TTS ऑडियो को deck HTML में इंजेक्ट करता है फिर Playwright Java के माध्यम से वीडियो कैप्चर करता है
task.generateCapsuleVideoAllLanguages.description=अनुवादित deck और स्क्रिप्ट से प्रत्येक लक्ष्य भाषा के लिए एक स्थानीयकृत capsule WebM जनरेट करता है
task.deployCapsule.description=FFmpeg के माध्यम से capsule वीडियो को वर्टिकल 9:16 प्रारूप (TikTok/Shorts) में क्रॉप करता है
task.distributeCapsuleVideo.description=capsule WebM वीडियो को वर्सन वाले गंतव्य निर्देशिका में कॉपी करता है (CAP-ARCH-7)
task.collectCapsuleContext.description=capsule संदर्भ (वीडियो पथ + मेटाडेटा) को N3-इंजन-संगत JSON के रूप में निर्यात करता है
task.transformCapsuleContext.description=capsule-context.json फ़ाइल को पार्स करता है और deck की सूची लौटाता है
task.collectCapsuleRetrieve.description=capsule-context.json से capsule deck पुनर्प्राप्त करता है (N3 इंजन अनुबंध)
task.scaffoldCapsuleContext.description=टिप्पणियों के साथ एक डिफ़ॉल्ट capsule-context.yml कॉन्फ़िगरेशन फ़ाइल स्कैफोल्ड करता है
task.capsuleAiSmokeTest.description=न्यूनतम प्रॉम्प्ट के साथ codebase LLM ब्रिज (LlmBuildService + ChatModel एडाप्टर) का स्मोक-टेस्ट करता है
task.collectCapsuleAugmentedContext.description=संवर्धित संदर्भ (EAGER गवर्नेंस + RAG + Graphify + Docs) एकत्र करता है और सामग्री जनरेशन के लिए इसे रेंडर करता है
task.generateCapsuleContent.description=koog पाइपलाइन (propose-context → validate → speaker notes जनरेशन) को LLM के माध्यम से ऑर्केस्ट्रेट करता है और TTS स्क्रिप्ट व्युत्पन्न करता है
task.extractSpeakerNotes.description=AsciiDoc deck से speaker notes निकालता है और capsule स्क्रिप्ट जनरेट करता है (slider-gradle के generateCapsule को प्रतिस्थापित करता है)।
task.translateAndExtractSpeakerNotes.description=deck को कई भाषाओं में अनुवाद करता है फिर सभी अनुवादित deck के लिए speaker notes निकालता है। translateDeck और extractSpeakerNotes पर निर्भर करता है।
task.translateAndGenerateCapsuleVideos.description=deck का अनुवाद करता है, सभी अनुवादित deck के लिए speaker notes निकालता है, फिर प्रत्येक भाषा के लिए एक स्थानीयकृत capsule WebM जनरेट करता है। translateAndExtractSpeakerNotes और generateCapsuleVideoAllLanguages पर निर्भर करता है।
task.generateCapsuleContentAndVideos.description=LLM सामग्री जनरेशन को ऑर्केस्ट्रेट करता है फिर पूर्ण मल्टी-भाषा वीडियो पाइपलाइन चलाता है। generateCapsuleContent और translateAndGenerateCapsuleVideos पर निर्भर करता है।
task.validateCapsuleVideoDuration.description=अंतिम वीडियो की अवधि जाँचता है और उसकी तुलना TTS ऑडियो अवधियों के योग से करता है (CAP-CR3-1 वीडियो सुदृढ़ता अनुबंध)
task.generateCapsuleTranscript.description=capsule speaker notes से एक AsciiDoc ट्रांसक्रिप्ट लेख तैयार करता है (TEMPLATE या LLM-संवर्धित)
task.generateCapsulePodcast.description=प्रति-स्लाइड TTS MP3 फ़ाइलों को FFmpeg concat demuxer के माध्यम से एकल पॉडकास्ट MP3 में जोड़ता है (केवल-ऑडियो मोबाइल उपभोग)
