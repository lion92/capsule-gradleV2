# Capsule Plugin — Messages (Spanish / Español)

# ── Task Groups ──
task.group.generate=generación
task.group.collect=recolección
task.group.deploy=despliegue
task.group.distribute=distribución
task.group.transform=transformación
task.group.capsule=capsule
task.group.verification=verificación

# ── Task Descriptions ──
task.generateCapsuleScript.description=Lee los *-script.txt producidos por extractSpeakerNotes y valida el script de capsule
task.generateCapsule.description=Genera archivos de audio TTS a partir de scripts de capsule (marcador de posición Piper)
task.generateCapsuleVideo.description=Inyecta el audio TTS en el HTML del deck y luego captura el vídeo mediante Playwright Java
task.generateCapsuleVideoAllLanguages.description=Genera un WebM de capsule localizado por idioma de destino a partir de decks y scripts traducidos
task.deployCapsule.description=Recorta los vídeos de capsule al formato vertical 9:16 (TikTok/Shorts) mediante FFmpeg
task.distributeCapsuleVideo.description=Copia los vídeos WebM de capsule a un directorio de destino versionado (CAP-ARCH-7)
task.collectCapsuleContext.description=Exporta el contexto de capsule (rutas de vídeo + metadatos) como JSON compatible con el motor N3
task.transformCapsuleContext.description=Analiza el archivo capsule-context.json y devuelve una lista de decks
task.collectCapsuleRetrieve.description=Recupera los decks de capsule desde capsule-context.json (contrato del motor N3)
task.scaffoldCapsuleContext.description=Genera un archivo de configuración capsule-context.yml predeterminado con comentarios
task.capsuleAiSmokeTest.description=Realiza una prueba de humo del puente LLM de codebase (LlmBuildService + adaptador ChatModel) con un prompt mínimo
task.collectCapsuleAugmentedContext.description=Recopila el contexto aumentado (gobernanza EAGER + RAG + Graphify + Docs) y lo renderiza para la generación de contenido
task.generateCapsuleContent.description=Orquesta el pipeline de koog (propose-context → validate → generar speaker notes) mediante LLM y deriva el script TTS
task.extractSpeakerNotes.description=Extrae las speaker notes de los decks AsciiDoc y genera un script de capsule (reemplaza a generateCapsule de slider-gradle).
task.translateAndExtractSpeakerNotes.description=Traduce un deck a varios idiomas y luego extrae las speaker notes de todos los decks traducidos. Depende de translateDeck y extractSpeakerNotes.
task.translateAndGenerateCapsuleVideos.description=Traduce un deck, extrae las speaker notes de todos los decks traducidos y luego genera un WebM de capsule localizado por idioma. Depende de translateAndExtractSpeakerNotes y generateCapsuleVideoAllLanguages.
task.generateCapsuleContentAndVideos.description=Orquesta la generación de contenido mediante LLM y luego ejecuta el pipeline completo de vídeo multilingüe. Depende de generateCapsuleContent y translateAndGenerateCapsuleVideos.
task.validateCapsuleVideoDuration.description=Sondea la duración del vídeo final y la compara con la suma de las duraciones de audio TTS (contrato de solidez de vídeo CAP-CR3-1)
task.generateCapsuleTranscript.description=Produce un artículo AsciiDoc de transcripción desde las speaker notes de la cápsula (TEMPLATE o enriquecido por LLM)
task.generateCapsulePodcast.description=Concatena los archivos MP3 TTS por diapositiva en un único podcast MP3 mediante el concat demuxer de FFmpeg (consumo móvil solo audio)
