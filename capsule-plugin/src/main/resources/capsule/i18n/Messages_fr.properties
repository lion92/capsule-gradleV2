# Capsule Plugin — Messages (Français)

# ── Groupes de tâches ──
task.group.generate=générer
task.group.collect=collecter
task.group.deploy=déployer
task.group.distribute=distribuer
task.group.transform=transformer
task.group.capsule=capsule
task.group.verification=vérification

# ── Descriptions de tâches ──
task.generateCapsuleScript.description=Lit les fichiers *-script.txt produits par extractSpeakerNotes et valide le script capsule
task.generateCapsule.description=Génère les fichiers audio TTS à partir des scripts capsule (Piper placeholder)
task.generateCapsuleVideo.description=Injecte l'audio TTS dans le deck HTML puis capture la vidéo via Playwright Java
task.generateCapsuleVideoAllLanguages.description=Génère une capsule WebM localisée par langue cible à partir des decks et scripts traduits
task.deployCapsule.description=Recadre les capsules en format vertical 9:16 (TikTok/Shorts) via FFmpeg
task.distributeCapsuleVideo.description=Copie les vidéos WebM capsule vers un répertoire de destination versionné (CAP-ARCH-7)
task.collectCapsuleContext.description=Exporte le contexte des capsules (chemins vidéos + métadonnées) en JSON compatible engine N3
task.transformCapsuleContext.description=Parse le fichier capsule-context.json et retourne une liste de decks
task.collectCapsuleRetrieve.description=Récupère les decks capsule depuis capsule-context.json (contrat engine N3)
task.scaffoldCapsuleContext.description=Génère un fichier de configuration capsule-context.yml par défaut avec commentaires
task.capsuleAiSmokeTest.description=Test de fumée du pont LLM codebase (LlmBuildService + adaptateur ChatModel) avec un prompt minimal
task.collectCapsuleAugmentedContext.description=Collecte le contexte augmenté (gouvernance EAGER + RAG + Graphify + Docs) et le rend pour la génération de contenu
task.generateCapsuleContent.description=Orchestre le pipeline koog (propose-context → validate → generate speaker notes) via LLM et dérive le script TTS
task.extractSpeakerNotes.description=Extrait les notes de speaker des decks AsciiDoc et génère un script capsule (remplace slider-gradle generateCapsule).
task.translateAndExtractSpeakerNotes.description=Traduit un deck en plusieurs langues puis extrait les notes de speaker pour tous les decks traduits. Dépend de translateDeck et extractSpeakerNotes.
task.translateAndGenerateCapsuleVideos.description=Traduit un deck, extrait les notes de speaker pour tous les decks traduits, puis génère une capsule WebM localisée par langue. Dépend de translateAndExtractSpeakerNotes et generateCapsuleVideoAllLanguages.
task.generateCapsuleContentAndVideos.description=Orchestre la génération de contenu LLM puis le pipeline vidéo multi-langue complet. Dépend de generateCapsuleContent et translateAndGenerateCapsuleVideos.
task.validateCapsuleVideoDuration.description=Sonde la durée de la vidéo finale et la compare à la somme des durées audio TTS (contrat de solidité vidéo CAP-CR3-1)
task.generateCapsuleTranscript.description=Génère un article AsciiDoc de révision depuis les notes de speaker de la capsule (TEMPLATE ou enrichi par LLM)
