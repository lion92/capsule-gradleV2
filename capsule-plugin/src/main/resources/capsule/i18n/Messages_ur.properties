task.translateAndGenerateCapsuleVideos.description=deck کا ترجمہ کرتا ہے، تمام مترجم deck کے لیے speaker notes نکالتا ہے، پھر ہر زبان کے لیے ایک مقامی capsule WebM تخلیق کرتا ہے۔ translateAndExtractSpeakerNotes اور generateCapsuleVideoAllLanguages پر منحصر ہے۔
