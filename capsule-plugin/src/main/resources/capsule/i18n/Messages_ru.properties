# Capsule Plugin — Messages (Russian / Русский)

# ── Task Groups ──
task.group.generate=генерация
task.group.collect=сбор
task.group.deploy=развёртывание
task.group.distribute=распространение
task.group.transform=преобразование
task.group.capsule=capsule
task.group.verification=проверка

# ── Task Descriptions ──
task.generateCapsuleScript.description=Читает *-script.txt, созданные extractSpeakerNotes, и проверяет скрипт capsule
task.generateCapsule.description=Создаёт аудиофайлы TTS из скриптов capsule (заглушка Piper)
task.generateCapsuleVideo.description=Внедряет аудио TTS в HTML deck, затем захватывает видео через Playwright Java
task.generateCapsuleVideoAllLanguages.description=Создаёт по одному локализованному capsule WebM на каждый целевой язык из переведённых deck и скриптов
task.deployCapsule.description=Обрезает видео capsule до вертикального формата 9:16 (TikTok/Shorts) через FFmpeg
task.distributeCapsuleVideo.description=Копирует видео capsule WebM в каталог назначения с версионированием (CAP-ARCH-7)
task.collectCapsuleContext.description=Экспортирует контекст capsule (пути к видео + метаданные) как JSON, совместимый с движком N3
task.transformCapsuleContext.description=Разбирает файл capsule-context.json и возвращает список deck
task.collectCapsuleRetrieve.description=Извлекает deck capsule из capsule-context.json (контракт движка N3)
task.scaffoldCapsuleContext.description=Создаёт файл конфигурации capsule-context.yml по умолчанию с комментариями
task.capsuleAiSmokeTest.description=Дымовое тестирование моста LLM в codebase (LlmBuildService + адаптер ChatModel) с минимальным промптом
task.collectCapsuleAugmentedContext.description=Собирает расширенный контекст (управление EAGER + RAG + Graphify + Docs) и подготавливает его для генерации контента
task.generateCapsuleContent.description=Оркеструет конвейер koog (propose-context → validate → генерация speaker notes) через LLM и выводит скрипт TTS
task.extractSpeakerNotes.description=Извлекает speaker notes из deck AsciiDoc и создаёт скрипт capsule (заменяет generateCapsule из slider-gradle).
task.translateAndExtractSpeakerNotes.description=Переводит deck на несколько языков, затем извлекает speaker notes для всех переведённых deck. Зависит от translateDeck и extractSpeakerNotes.
task.translateAndGenerateCapsuleVideos.description=Переводит deck, извлекает speaker notes для всех переведённых deck, затем создаёт по одному локализованному capsule WebM на каждый язык. Зависит от translateAndExtractSpeakerNotes и generateCapsuleVideoAllLanguages.
task.generateCapsuleContentAndVideos.description=Оркеструет генерацию контента через LLM, затем запускает полный мультиязычный видеоконвейер. Зависит от generateCapsuleContent и translateAndGenerateCapsuleVideos.
task.validateCapsuleVideoDuration.description=Измеряет длительность финального видео и сравнивает её с суммой длительностей аудио TTS (контракт надёжности видео CAP-CR3-1)
task.generateCapsuleTranscript.description=Создаёт статью AsciiDoc транскрипта из speaker notes капсулы (TEMPLATE или обогащённая LLM)
task.generateCapsulePodcast.description=Объединяет MP3-файлы TTS по слайдам в один MP3-подкаст через concat demuxer FFmpeg (мобильное потребление только аудио)
