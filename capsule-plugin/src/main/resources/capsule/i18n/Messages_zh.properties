# Capsule Plugin — Messages (Chinese / 中文)

# ── Task Groups ──
task.group.generate=生成
task.group.collect=收集
task.group.deploy=部署
task.group.distribute=分发
task.group.transform=转换
task.group.capsule=capsule
task.group.verification=验证

# ── Task Descriptions ──
task.generateCapsuleScript.description=读取由 extractSpeakerNotes 生成的 *-script.txt 并验证 capsule 脚本
task.generateCapsule.description=从 capsule 脚本生成 TTS 音频文件（Piper 占位符）
task.generateCapsuleVideo.description=将 TTS 音频注入 deck HTML，然后通过 Playwright Java 捕获视频
task.generateCapsuleVideoAllLanguages.description=从翻译的 deck 和脚本生成每种目标语言的本地化 capsule WebM
task.deployCapsule.description=通过 FFmpeg 将 capsule 视频裁剪为竖屏 9:16 格式（TikTok/Shorts）
task.distributeCapsuleVideo.description=将 capsule WebM 视频复制到版本化目标目录（CAP-ARCH-7）
task.collectCapsuleContext.description=将 capsule 上下文（视频路径 + 元数据）导出为兼容 N3 引擎的 JSON
task.transformCapsuleContext.description=解析 capsule-context.json 文件并返回 deck 列表
task.collectCapsuleRetrieve.description=从 capsule-context.json 检索 capsule deck（N3 引擎契约）
task.scaffoldCapsuleContext.description=搭建默认的 capsule-context.yml 配置文件（带注释）
task.capsuleAiSmokeTest.description=使用最小提示对 codebase LLM 桥接（LlmBuildService + ChatModel 适配器）进行冒烟测试
task.collectCapsuleAugmentedContext.description=收集增强上下文（EAGER 治理 + RAG + Graphify + Docs）并渲染以用于内容生成
task.generateCapsuleContent.description=通过 LLM 编排 koog 流水线（propose-context → validate → 生成 speaker notes）并派生 TTS 脚本
task.extractSpeakerNotes.description=从 AsciiDoc deck 中提取 speaker notes 并生成 capsule 脚本（替代 slider-gradle 的 generateCapsule）。
task.translateAndExtractSpeakerNotes.description=将 deck 翻译为多种语言，然后为所有翻译后的 deck 提取 speaker notes。依赖 translateDeck 和 extractSpeakerNotes。
task.translateAndGenerateCapsuleVideos.description=翻译 deck，为所有翻译后的 deck 提取 speaker notes，然后为每种语言生成一个本地化的 capsule WebM。依赖 translateAndExtractSpeakerNotes 和 generateCapsuleVideoAllLanguages。
task.generateCapsuleContentAndVideos.description=编排 LLM 内容生成，然后执行完整的多语言视频流水线。依赖 generateCapsuleContent 和 translateAndGenerateCapsuleVideos。
task.validateCapsuleVideoDuration.description=探测最终视频时长并与 TTS 音频时长总和比较（CAP-CR3-1 视频可靠性契约）
task.generateCapsuleTranscript.description=生成从 capsule speaker notes 出发的 AsciiDoc 文章转录（TEMPLATE 模板或 LLM 增强）
