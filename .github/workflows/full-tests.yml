name: Full Tests

on:
  push:
    branches: [main, master]

jobs:
  full-tests:
    name: Full Test Suite (real binaries + duration validation)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Install ffmpeg + espeak
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-data

      - name: Install Playwright Chromium
        run: |
          cd capsule-plugin
          ./gradlew --version
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Run fast tests (unit + functional + cucumber dedicated)
        run: ./gradlew test functionalTest
        working-directory: capsule-plugin
        env:
          CI: "true"

      # `validateCapsuleVideoDuration` is a task the *consumer* project gets when it
      # applies education.cccp.capsule — the plugin project itself never applies it,
      # so invoking it here always failed with "task not found". The video solidity
      # contract is covered by its dedicated Cucumber runner instead.
      - name: Run duration validation scenarios (video solidity contract)
        run: ./gradlew cucumberTestDurationValidation -PrunCucumber
        working-directory: capsule-plugin
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: capsule-plugin/build/reports/